name: Sync upstream johnshall config

on:
  schedule:
    - cron: '0 20 * * 0'    # 每周一 04:00 北京时间
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull upstream and re-apply custom block
        run: python3 scripts/sync_upstream.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lazy_group.conf
          if git diff --cached --quiet; then
            echo "上游无变化"
          else
            git commit -m "sync: upstream johnshall lazy_group.conf"
            git push
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/levi-dev-bot/shadowrocket-config@main/lazy_group.conf" || true
          fi
